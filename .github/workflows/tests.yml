name: Tests

on:
  push:
    branches:
      - main
      - master
      - develop
      - development
      - "dev/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: ""
      REDIS_URL: " "
      RESEND_API_KEY: ""
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: ""
      ADMIN_NOTIFICATION_EMAIL: ""
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install root dependencies
        run: npm ci

      - name: Server unit and integration tests
        run: npm run test:coverage --prefix server

      - name: Client unit tests
        run: npm run test:coverage --prefix client

      - name: Server typecheck
        run: npm run typecheck --prefix server

      - name: Client typecheck
        run: npm run typecheck --prefix client

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Build public frontend
        run: npm run build --prefix client

      - name: Build admin console
        run: npm run build:console

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
