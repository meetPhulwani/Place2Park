# Source-mounted development stack. The API is not published on the host.
# The browser talks to Vite, and Vite proxies /api to the api service.

name: place2park-dev

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: development
    image: place2park-api:dev
    env_file:
      - path: server/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: "5000"
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./server:/app/server
      - api-dev-modules:/app/server/node_modules
    networks:
      - place2park-dev
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: development
    image: place2park-web:dev
    environment:
      E2E_API_ORIGIN: http://api:5000
      VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./client:/app/client
      - web-dev-modules:/app/client/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - place2park-dev
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

networks:
  place2park-dev:
    name: place2park-dev

volumes:
  api-dev-modules:
  web-dev-modules:
