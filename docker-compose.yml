# Local run of the production images. MongoDB Atlas and Redis stay outside Docker.
# Day-to-day Vite development is docker-compose.dev.yml.

name: place2park

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
    image: place2park-api:local
    env_file:
      - docker/runtime.env
      - path: server/.env
        required: false
    environment:
      PORT: "5000"
    volumes:
      - api-uploads:/app/server/uploads
    networks:
      - place2park
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||5000)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-}
    image: place2park-web:local
    environment:
      API_UPSTREAM: api:5000
      ADMIN_CONSOLE_PATH: ${ADMIN_CONSOLE_PATH:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - place2park
    restart: unless-stopped
    stop_grace_period: 20s

networks:
  place2park:
    name: place2park

volumes:
  api-uploads:
